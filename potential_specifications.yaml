    - neighborhood_api_contract_and_seed_type_handling
    - neighborhood_expansion_pass_design_and_stop_conditions
    - weighted_edge_model_and_configuration_strategy
    - output_schema_definition_for_each_evidence_module
    - source_adapter_boundaries_and_fallback_rules
    - baseline_metrics_and_success_measurement
