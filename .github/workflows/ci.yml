name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check lint
        run: uv run ruff check .

      - name: Check patch hygiene
        run: git diff --check

      - name: Build package
        run: uv build
