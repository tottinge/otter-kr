name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check lint
        run: uv run ruff check .

      - name: Check patch hygiene
        run: git diff --check

      - name: Generate provider contract
        run: uv run otter-kr-contract > /tmp/otter-kr-contract.json

      - name: Build package
        run: uv build
