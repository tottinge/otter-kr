[project]
name = "otter-kr"
version = "0.1.0"
description = "Deterministic source-repository evidence for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.7",
    "networkx>=3.6.1",
]

[project.scripts]
otter-kr = "otter_kr.server:main"

[dependency-groups]
dev = [
    "mutmut==3.7.0",
    "pytest==8.4.2",
    "ruff==0.12.11",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/otter_kr"]
mutate_only_covered_lines = true
pytest_add_cli_args = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
